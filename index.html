<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>Alpha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Sora:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#040404;
    --black-2:#0a0a0a;
    --white:#f2f2f2;
    --white-dim:#9a9a9a;
    --red:#ff2d2d;
    --red-dim:#7a1414;
    --glass:rgba(255,255,255,0.035);
    --glass-border:rgba(255,255,255,0.09);
    --item-h:84px;
  }

  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;width:100%;min-height:100%;
    background:var(--black);
    color:var(--white);
    font-family:'Sora',sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  /* ---------- backgrounds ---------- */
  #bg-canvas{
    position:fixed; inset:0; width:100%; height:100%;
    z-index:0; display:block; background:var(--black);
  }
  #css-fallback-bg{
    position:fixed; inset:0; z-index:0;
    background:
      radial-gradient(circle at 30% 20%, rgba(255,45,45,0.10), transparent 55%),
      radial-gradient(circle at 70% 80%, rgba(255,255,255,0.04), transparent 60%),
      linear-gradient(180deg, #050505 0%, #0c0505 50%, #050505 100%);
  }
  #css-fallback-bg[hidden]{display:none;}

  /* ---------- intro ---------- */
  #intro{
    position:fixed; inset:0; z-index:50;
    display:flex; align-items:center; justify-content:center;
    background:#000;
    opacity:1;
    transition:opacity .4s ease;
  }
  #intro.fade-out{opacity:0; pointer-events:none;}

  #intro-particles{
    position:absolute; inset:0; overflow:hidden; pointer-events:none;
  }
  #intro-particles .particle{
    position:absolute; width:2px; height:2px; border-radius:50%;
    background:var(--white); opacity:0;
    animation-name:driftParticle; animation-timing-function:ease-in-out; animation-iteration-count:infinite;
    will-change:transform,opacity;
  }
  @keyframes driftParticle{
    0%{opacity:0; transform:translateY(0);}
    50%{opacity:.6;}
    100%{opacity:0; transform:translateY(-40px);}
  }

  #intro-emblem-wrap{
    position:relative; width:min(46vw,220px); height:min(46vw,220px);
    opacity:0; transform:scale(.7);
  }
  #intro.animating #intro-emblem-wrap{
    animation:emblemIntro 3s ease forwards;
  }
  #intro.reduced #intro-emblem-wrap{
    opacity:1; transform:scale(1);
  }
  @keyframes emblemIntro{
    0%{opacity:0; transform:scale(.6);}
    10%{opacity:1; transform:scale(1);}
    27%{opacity:1; transform:scale(1);}
    76%{opacity:1; transform:scale(1.04); filter:drop-shadow(0 0 26px rgba(255,45,45,.55));}
    100%{opacity:0; transform:scale(1.5); filter:drop-shadow(0 0 0 rgba(255,45,45,0));}
  }
  #intro.animating #intro-emblem-wrap .emblem-svg{
    animation:emblemPulse 1.5s ease-in-out infinite;
  }
  @keyframes emblemPulse{
    0%,100%{filter:drop-shadow(0 0 6px rgba(255,45,45,.35));}
    50%{filter:drop-shadow(0 0 22px rgba(255,45,45,.75));}
  }

  #skip-btn{
    position:absolute; right:20px; bottom:max(20px, env(safe-area-inset-bottom));
    background:transparent; border:1px solid var(--glass-border); color:var(--white-dim);
    font-family:'Sora',sans-serif; font-size:12px; letter-spacing:.12em; text-transform:uppercase;
    padding:10px 16px; border-radius:999px; cursor:pointer;
    transition:opacity .25s ease, border-color .25s ease, color .25s ease;
    opacity:.7;
  }
  #skip-btn:hover, #skip-btn:focus-visible{
    opacity:1; border-color:var(--red); color:var(--white);
  }
  #intro.reduced #skip-btn{opacity:.5;}

  /* ---------- app ---------- */
  #app{
    position:relative; z-index:1; min-height:100vh;
    display:flex; flex-direction:column; align-items:center;
    padding:calc(env(safe-area-inset-top) + 32px) 16px calc(env(safe-area-inset-bottom) + 32px);
  }
  #app[aria-hidden="true"]{visibility:hidden;}

  #profile-list{
    list-style:none; margin:0; padding:0;
    width:100%; max-width:520px;
    display:flex; flex-direction:column; gap:14px;
  }

  .profile-li{width:100%;}

  .profile-item{
    --mx:50%; --my:50%;
    position:relative;
    display:flex; align-items:center; gap:14px;
    width:100%; min-height:64px;
    padding:12px 18px 12px 12px;
    border-radius:20px;
    text-decoration:none; color:var(--white);
    background:
      radial-gradient(220px circle at var(--mx) var(--my), rgba(255,45,45,0.16), transparent 70%),
      linear-gradient(155deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015));
    border:1px solid var(--glass-border);
    box-shadow:0 10px 26px rgba(0,0,0,0.45);
    transform:translateZ(0) scale(1);
    transition:transform .28s cubic-bezier(.2,.8,.2,1), box-shadow .28s ease, border-color .28s ease;
    will-change:transform;
    -webkit-tap-highlight-color:transparent;
  }
  .profile-item:hover{
    transform:translateY(-2px) scale(1.012);
    border-color:rgba(255,45,45,0.35);
    box-shadow:0 16px 34px rgba(0,0,0,.55), 0 0 22px rgba(255,45,45,.08);
  }
  .profile-item.pressed{
    transform:scale(.97);
  }
  .profile-item:focus-visible{
    outline:2px solid var(--red); outline-offset:3px;
  }

  .avatar{
    position:relative; flex:0 0 auto;
    width:48px; height:48px; border-radius:50%;
    overflow:hidden; background:#111;
    border:1px solid rgba(255,255,255,0.12);
    transition:border-color .28s ease, box-shadow .28s ease;
  }
  .profile-item:hover .avatar, .profile-item:focus-visible .avatar{
    border-color:var(--red);
    box-shadow:0 0 14px rgba(255,45,45,.55);
  }
  .avatar img{
    width:100%; height:100%; object-fit:cover; display:block;
  }
  .avatar .emblem-svg{width:100%; height:100%; display:block;}

  .profile-name{
    flex:1 1 auto; min-width:0;
    font-family:'Syne',sans-serif; font-weight:700;
    font-size:17px; letter-spacing:.01em;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  .chevron{
    flex:0 0 auto; font-size:22px; line-height:1;
    color:var(--white-dim);
    transform:translateX(0);
    transition:transform .28s cubic-bezier(.2,.8,.2,1), color .28s ease, opacity .28s ease;
  }
  .profile-item:hover .chevron, .profile-item:focus-visible .chevron{
    transform:translateX(4px); color:var(--red);
  }

  /* ---------- emblem (shared, cloned via template) ---------- */
  .emblem-svg{width:100%;height:100%;}
  .emblem-fill{fill:#050505;}
  .emblem-stroke{fill:none; stroke:var(--white); stroke-width:1.1; stroke-linejoin:round;}
  .emblem-eye{fill:url(#eyeGlow);}

  @media (prefers-reduced-motion: reduce){
    #intro-emblem-wrap .emblem-svg{animation:none !important;}
  }

  ::selection{background:var(--red); color:#000;}
</style>
</head>
<body>

<canvas id="bg-canvas" aria-hidden="true"></canvas>
<div id="css-fallback-bg" aria-hidden="true" hidden></div>

<!-- shared SVG defs: referenced by every cloned emblem, defined exactly once -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff5b5b"/>
      <stop offset="45%" stop-color="#ff1f1f"/>
      <stop offset="100%" stop-color="#5a0000" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>

<div id="intro" role="presentation">
  <div id="intro-particles"></div>
  <div id="intro-emblem-wrap"></div>
  <button id="skip-btn" type="button" aria-label="Skip intro">Skip</button>
</div>

<main id="app" aria-hidden="true">
  <ul id="profile-list" role="list" aria-label="Profiles"></ul>
</main>

<!-- procedural three-headed emblem, defined once, cloned everywhere via mountEmblem() -->
<template id="emblem-template">
  <svg class="emblem-svg" viewBox="0 0 200 200" role="img" aria-label="Alpha emblem">
    <!-- collar / body -->
    <polygon class="emblem-fill" points="62,108 100,96 138,108 150,150 100,178 50,150"></polygon>
    <polygon class="emblem-stroke" points="62,108 100,96 138,108 150,150 100,178 50,150"></polygon>

    <!-- left head -->
    <polygon class="emblem-fill" points="30,78 52,58 66,66 68,92 54,108 34,102"></polygon>
    <polygon class="emblem-stroke" points="30,78 52,58 66,66 68,92 54,108 34,102"></polygon>
    <circle class="emblem-eye" cx="47" cy="80" r="4"></circle>

    <!-- right head (mirrored) -->
    <polygon class="emblem-fill" points="170,78 148,58 134,66 132,92 146,108 166,102"></polygon>
    <polygon class="emblem-stroke" points="170,78 148,58 134,66 132,92 146,108 166,102"></polygon>
    <circle class="emblem-eye" cx="153" cy="80" r="4"></circle>

    <!-- center / dominant head -->
    <polygon class="emblem-fill" points="100,18 130,42 136,72 124,98 100,112 76,98 64,72 70,42"></polygon>
    <polygon class="emblem-stroke" points="100,18 130,42 136,72 124,98 100,112 76,98 64,72 70,42"></polygon>
    <circle class="emblem-eye" cx="87" cy="66" r="5.5"></circle>
    <circle class="emblem-eye" cx="113" cy="66" r="5.5"></circle>
    <polygon class="emblem-stroke" points="100,18 100,112"></polygon>
  </svg>
</template>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>
(function(){
  "use strict";

  /* =========================================================
     0. DATA SOURCE — the ONLY place profile data is declared.
     Adding profile #2, #3, ... #N requires nothing more than
     pushing objects onto this array, or swapping the source
     entirely via setDataSource(). Nothing below this section
     ever needs to change to support 1 profile or a trillion.
     ========================================================= */
  var profiles = [
    {
      id: "alpha",
      name: "Alpha",
      image: "https://raw.githubusercontent.com/mdimrankhanalpha/Alpha/main/file_0000000012b081fa9718ddb092393a0e.png",
      url: "https://mdimrankhanalpha.github.io/Alpha-/"
    }
  ];

  var dataSource = {
    length: function(){ return profiles.length; },
    get: function(i){ return profiles[i]; }
  };

  function setDataSource(src){
    dataSource = src;
    lastRange = [-1,-1];
    renderList(true);
  }
  window.setDataSource = setDataSource; // exposed for future paginated/streamed sources

  /* =========================================================
     1. CONFIG — single source of truth for all timing/tiers
     ========================================================= */
  var CONFIG = {
    loopDuration: 46,
    timeline: {
      voidPhase:      [0, 5],
      formation:      [5, 12],
      approach:       [12, 27],
      megaHold:       [27, 30],
      blackHoleBirth: [30, 33],
      consumption:    [33, 40],
      collapse:       [40, 43],
      destruction:    [43, 44],
      darkness:       [44, 46]
    },
    buffer: 8
  };

  var PERF_TIERS = {
    HIGH:   { galaxyStars: 7000, galaxyDust: 2600, galaxyDustLane: 1600, starfield: 3000, debris: 1200, dpr: 2 },
    MEDIUM: { galaxyStars: 3400, galaxyDust: 1300, galaxyDustLane: 800,  starfield: 1500, debris: 600,  dpr: 1.5 },
    LOW:    { galaxyStars: 1300, galaxyDust: 500,  galaxyDustLane: 320,  starfield: 600,  debris: 250,  dpr: 1 }
  };

  function detectTier(){
    var mem = navigator.deviceMemory || 4;
    var cores = navigator.hardwareConcurrency || 4;
    var w = window.innerWidth;
    if (mem <= 2 || cores <= 2 || w < 480) return 'LOW';
    if (mem <= 4 || cores <= 4 || w < 900) return 'MEDIUM';
    return 'HIGH';
  }

  var reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* =========================================================
     2. MATH HELPERS
     ========================================================= */
  function clamp01(x){ return Math.min(1, Math.max(0, x)); }
  function lerp(a,b,t){ return a + (b - a) * t; }
  function smoothstep(e0, e1, x){
    var t = clamp01((x - e0) / (e1 - e0));
    return t * t * (3 - 2 * t);
  }

  /* =========================================================
     3. EMBLEM — single template, cloned everywhere
     ========================================================= */
  function mountEmblem(container){
    var tpl = document.getElementById('emblem-template');
    container.appendChild(tpl.content.cloneNode(true));
  }

  /* =========================================================
     4. PROFILE LIST — virtualized rendering
     ========================================================= */
  var listEl = document.getElementById('profile-list');
  var currentIndex = 0;
  var lastRange = [-1, -1];
  var ITEM_HEIGHT = 98; // refined after first real render
  var ITEM_GAP = 14;

  function buildAvatar(profile){
    var wrap = document.createElement('span');
    wrap.className = 'avatar';
    if (profile.image && profile.image !== 'emblem'){
      var img = document.createElement('img');
      img.src = profile.image;
      img.alt = '';
      img.loading = 'lazy';
      img.decoding = 'async';
      img.onerror = function(){
        wrap.innerHTML = '';
        mountEmblem(wrap);
        img.onerror = null;
      };
      wrap.appendChild(img);
    } else {
      mountEmblem(wrap);
    }
    return wrap;
  }

  function buildItem(profile){
    var li = document.createElement('li');
    li.className = 'profile-li';

    var a = document.createElement('a');
    a.className = 'profile-item';
    a.href = profile.url;
    a.setAttribute('aria-label', profile.name);

    a.appendChild(buildAvatar(profile));

    var name = document.createElement('span');
    name.className = 'profile-name';
    name.textContent = profile.name;
    a.appendChild(name);

    var chevron = document.createElement('span');
    chevron.className = 'chevron';
    chevron.setAttribute('aria-hidden', 'true');
    chevron.textContent = '\u203A';
    a.appendChild(chevron);

    a.addEventListener('pointermove', function(e){
      var rect = a.getBoundingClientRect();
      a.style.setProperty('--mx', ((e.clientX - rect.left) / rect.width * 100) + '%');
      a.style.setProperty('--my', ((e.clientY - rect.top) / rect.height * 100) + '%');
    });
    a.addEventListener('touchstart', function(){ a.classList.add('pressed'); }, {passive:true});
    a.addEventListener('touchend', function(){ a.classList.remove('pressed'); });
    a.addEventListener('touchcancel', function(){ a.classList.remove('pressed'); });

    li.appendChild(a);
    return li;
  }

  function estimateIndex(){
    var scrollTop = window.scrollY || document.documentElement.scrollTop || 0;
    var listTop = listEl.getBoundingClientRect().top + scrollTop;
    var rel = Math.max(0, scrollTop - listTop);
    return Math.max(0, Math.floor(rel / (ITEM_HEIGHT + ITEM_GAP)));
  }

  function computeRange(){
    var total = dataSource.length();
    var start = Math.max(0, currentIndex - CONFIG.buffer);
    var end = Math.min(total - 1, currentIndex + CONFIG.buffer);
    return [start, end];
  }

  function measureItemHeight(){
    var li = listEl.querySelector('.profile-li');
    if (li){
      var h = li.getBoundingClientRect().height;
      if (h > 0) ITEM_HEIGHT = h;
    }
  }

  function renderList(force){
    var total = dataSource.length();
    if (total <= 0){
      listEl.innerHTML = '';
      listEl.style.paddingTop = '0px';
      listEl.style.paddingBottom = '0px';
      return;
    }
    var range = computeRange();
    var start = range[0], end = range[1];
    if (!force && start === lastRange[0] && end === lastRange[1]) return;
    lastRange = [start, end];

    listEl.style.paddingTop = (start * (ITEM_HEIGHT + ITEM_GAP)) + 'px';
    listEl.style.paddingBottom = ((total - end - 1) * (ITEM_HEIGHT + ITEM_GAP)) + 'px';

    var frag = document.createDocumentFragment();
    for (var i = start; i <= end; i++){
      frag.appendChild(buildItem(dataSource.get(i)));
    }
    listEl.innerHTML = '';
    listEl.appendChild(frag);
    measureItemHeight();
  }

  var scrollTicking = false;
  window.addEventListener('scroll', function(){
    if (!scrollTicking){
      requestAnimationFrame(function(){
        currentIndex = estimateIndex();
        renderList(false);
        scrollTicking = false;
      });
      scrollTicking = true;
    }
  }, {passive:true});

  window.addEventListener('resize', function(){
    measureItemHeight();
  });

  /* =========================================================
     5. INTRO SEQUENCE
     ========================================================= */
  var introEl = document.getElementById('intro');
  var skipBtn = document.getElementById('skip-btn');
  var appEl = document.getElementById('app');

  function spawnIntroParticles(){
    if (reducedMotion) return;
    var container = document.getElementById('intro-particles');
    var count = 42;
    for (var i = 0; i < count; i++){
      var p = document.createElement('span');
      p.className = 'particle';
      p.style.left = (Math.random() * 100) + '%';
      p.style.top = (Math.random() * 100) + '%';
      p.style.animationDelay = (Math.random() * 2.2) + 's';
      p.style.animationDuration = (2 + Math.random() * 2) + 's';
      container.appendChild(p);
    }
  }

  function finishIntro(){
    introEl.classList.add('fade-out');
    setTimeout(function(){
      if (introEl.parentNode) introEl.parentNode.removeChild(introEl);
      appEl.removeAttribute('aria-hidden');
      renderList(true);
      startCosmic();
    }, 420);
  }

  function runIntro(){
    var seen = sessionStorage.getItem('alphaIntroSeen');
    if (seen){
      if (introEl.parentNode) introEl.parentNode.removeChild(introEl);
      appEl.removeAttribute('aria-hidden');
      renderList(true);
      startCosmic();
      return;
    }
    sessionStorage.setItem('alphaIntroSeen', '1');
    mountEmblem(document.getElementById('intro-emblem-wrap'));
    spawnIntroParticles();

    if (reducedMotion){
      introEl.classList.add('reduced');
    } else {
      introEl.classList.add('animating');
    }

    var duration = reducedMotion ? 700 : 3000;
    var timer = setTimeout(finishIntro, duration);
    skipBtn.addEventListener('click', function(){
      clearTimeout(timer);
      finishIntro();
    });
  }

  /* =========================================================
     6. COSMIC BACKGROUND (Three.js) — VOID > FORMATION >
     APPROACH/COLLISION > MEGA-HOLD > BLACK HOLE BIRTH >
     CONSUMPTION > COLLAPSE > SELF-DESTRUCTION > DARKNESS
     ========================================================= */
  var webglAvailable = true;
  var tier, tierConfig;
  var renderer, scene, camera, clock;
  var galaxy1, galaxy2, blackHoleGroup, shockwaveMesh, flashLight, starfield, debrisField;
  var rafId = null;
  var mouseX = 0, mouseY = 0, targetMouseX = 0, targetMouseY = 0;

  function detectWebGL(){
    try{
      var canvas = document.createElement('canvas');
      return !!(window.WebGLRenderingContext &&
        (canvas.getContext('webgl') || canvas.getContext('experimental-webgl')));
    } catch(e){ return false; }
  }

  function buildGalaxy(opts){
    var spin = opts.spin, armCount = opts.armCount, offset = opts.offset;
    var colorCore = new THREE.Color(opts.colorCore);      // warm-white core
    var colorArmHot = new THREE.Color(opts.colorArmHot);  // cool blue-white young stars
    var colorArmCool = new THREE.Color(opts.colorArmCool);// silver arm stars
    var colorRed = new THREE.Color(0xff3b3b);

    var starCount = tierConfig.galaxyStars;
    var dustCount = tierConfig.galaxyDust;
    var laneCount = tierConfig.galaxyDustLane;

    var starGeo = new THREE.BufferGeometry();
    var starPos = new Float32Array(starCount * 3);
    var starColor = new Float32Array(starCount * 3);
    var starBase = new Float32Array(starCount);
    var starAngle0 = new Float32Array(starCount);
    var starSeed = new Float32Array(starCount);
    var starHeight = new Float32Array(starCount);

    for (var i = 0; i < starCount; i++){
      var band = Math.random();
      var radius, col;
      if (band < 0.2){
        radius = Math.random() * 3;
        col = colorCore.clone().lerp(new THREE.Color(0xffffff), Math.random() * 0.3);
      } else if (band < 0.85){
        radius = 3 + Math.random() * 9;
        // mix hot young (blue-white) and cooler (silver) arm stars for temperature variety
        col = Math.random() < 0.55 ? colorArmHot.clone() : colorArmCool.clone();
        col.lerp(new THREE.Color(0xffffff), Math.random() * 0.2);
      } else {
        radius = 12 + Math.random() * 6;
        col = colorArmCool.clone().lerp(new THREE.Color(0x3a3a42), 0.55);
      }

      var armIndex = Math.floor(Math.random() * armCount);
      var armOffset = (armIndex / armCount) * Math.PI * 2;
      // tighter scatter than before for crisper, more defined spiral arms
      var theta = armOffset + radius * 0.5 + (Math.random() - 0.5) * 0.32;

      starBase[i] = radius;
      starAngle0[i] = theta;
      starSeed[i] = Math.random() * 1000;
      starHeight[i] = (Math.random() - 0.5) * (radius * 0.07);

      if (Math.random() < 0.03) col = colorRed.clone();

      starColor[i*3] = col.r; starColor[i*3+1] = col.g; starColor[i*3+2] = col.b;
    }
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
    starGeo.setAttribute('color', new THREE.BufferAttribute(starColor, 3));
    var starMat = new THREE.PointsMaterial({
      size: 0.16, vertexColors: true, transparent: true, opacity: 0,
      depthWrite: false, sizeAttenuation: true
    });
    var starPoints = new THREE.Points(starGeo, starMat);

    var dustGeo = new THREE.BufferGeometry();
    var dustPos = new Float32Array(dustCount * 3);
    var dustBase = new Float32Array(dustCount);
    var dustAngle0 = new Float32Array(dustCount);
    var dustSeed = new Float32Array(dustCount);
    var dustHeight = new Float32Array(dustCount);

    for (var j = 0; j < dustCount; j++){
      var r2 = 4 + Math.random() * 16;
      var armIndex2 = Math.floor(Math.random() * armCount);
      var armOffset2 = (armIndex2 / armCount) * Math.PI * 2;
      dustBase[j] = r2;
      dustAngle0[j] = armOffset2 + r2 * 0.42 + (Math.random() - 0.5) * 1.2;
      dustSeed[j] = Math.random() * 1000;
      dustHeight[j] = (Math.random() - 0.5) * (r2 * 0.16);
    }
    dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
    var dustMat = new THREE.PointsMaterial({
      size: 0.11, color: 0x8d8d95, transparent: true, opacity: 0, depthWrite: false
    });
    var dustPoints = new THREE.Points(dustGeo, dustMat);

    // dust lanes: dark, tightly-hugging-the-arm particles that read as the
    // obscuring dust lanes visible in real spiral galaxies — offset slightly
    // "trailing" the arm centerline and biased toward the mid-radius band.
    var laneGeo = new THREE.BufferGeometry();
    var lanePos = new Float32Array(laneCount * 3);
    var laneBase = new Float32Array(laneCount);
    var laneAngle0 = new Float32Array(laneCount);
    var laneSeed = new Float32Array(laneCount);
    var laneHeight = new Float32Array(laneCount);

    for (var k = 0; k < laneCount; k++){
      var r3 = 3 + Math.random() * 10;
      var armIndex3 = Math.floor(Math.random() * armCount);
      var armOffset3 = (armIndex3 / armCount) * Math.PI * 2;
      laneBase[k] = r3;
      // trails just behind the star arm (offset by a small negative lag) and
      // hugs it tightly (narrow scatter) so it silhouettes against the stars
      laneAngle0[k] = armOffset3 + r3 * 0.5 - 0.14 + (Math.random() - 0.5) * 0.1;
      laneSeed[k] = Math.random() * 1000;
      laneHeight[k] = (Math.random() - 0.5) * (r3 * 0.04);
    }
    laneGeo.setAttribute('position', new THREE.BufferAttribute(lanePos, 3));
    var laneMat = new THREE.PointsMaterial({
      size: 0.13, color: 0x0c0c10, transparent: true, opacity: 0, depthWrite: false
    });
    var lanePoints = new THREE.Points(laneGeo, laneMat);

    return {
      points: starPoints, dust: dustPoints, lane: lanePoints,
      starBase: starBase, starAngle0: starAngle0, starSeed: starSeed, starHeight: starHeight,
      dustBase: dustBase, dustAngle0: dustAngle0, dustSeed: dustSeed, dustHeight: dustHeight,
      laneBase: laneBase, laneAngle0: laneAngle0, laneSeed: laneSeed, laneHeight: laneHeight,
      spin: spin, offset: offset, starMat: starMat, dustMat: dustMat, laneMat: laneMat
    };
  }

  function galaxyCenter(offset, t, spin, out){
    if (t < CONFIG.timeline.approach[0]){
      out.copy(offset);
      return out;
    }
    var p = smoothstep(CONFIG.timeline.approach[0], CONFIG.timeline.approach[1], t);
    var angle = p * p * Math.PI * 1.5 * spin;
    var radiusScale = lerp(1, 0.08, p);
    var x = offset.x * radiusScale;
    var z = offset.z * radiusScale;
    var cosA = Math.cos(angle), sinA = Math.sin(angle);
    out.set(x * cosA - z * sinA, offset.y * radiusScale, x * sinA + z * cosA);
    return out;
  }

  function galaxyOpacity(t){
    var birth = smoothstep(CONFIG.timeline.formation[0], CONFIG.timeline.formation[1], t);
    var op = birth;
    if (t >= CONFIG.timeline.consumption[0]){
      var pull = smoothstep(CONFIG.timeline.consumption[0], CONFIG.timeline.consumption[1], t);
      op = birth * (1 - pull);
    }
    if (t >= CONFIG.timeline.collapse[0]) op = 0;
    return clamp01(op);
  }

  function turbulence(t){
    var rise = smoothstep(20, CONFIG.timeline.approach[1], t);
    var fall = 1 - smoothstep(CONFIG.timeline.approach[1], CONFIG.timeline.megaHold[1], t) * 0.92;
    return clamp01(rise) * clamp01(fall);
  }

  function particleRA(baseRadius, angle0, seed, t, spin, out){
    var radius = baseRadius;
    var angle = angle0;

    var turb = turbulence(t);
    if (turb > 0){
      var wobble = Math.sin(seed * 12.9898) * 0.5 + 0.5; // deterministic, seeded once
      radius += wobble * turb * 2.4;
      angle += Math.sin(seed * 3.71) * turb * 0.6;
    }

    if (t >= CONFIG.timeline.consumption[0]){
      var pull = smoothstep(CONFIG.timeline.consumption[0], CONFIG.timeline.consumption[1], t);
      radius = radius * (1 - pull);
      angle += pull * pull * 6 * spin;
    }
    out.radius = radius;
    out.angle = angle;
    return out;
  }

  var _center = new THREE.Vector3 ? new THREE.Vector3() : null;
  var _ra = { radius: 0, angle: 0 };

  function updateGalaxyPositions(g, t, elapsed){
    galaxyCenter(g.offset, t, g.spin, _center);
    var opacity = galaxyOpacity(t);
    g.starMat.opacity = opacity;
    g.dustMat.opacity = opacity * 0.35;
    g.laneMat.opacity = opacity * 0.55;

    var starAttr = g.points.geometry.attributes.position;
    var sArr = starAttr.array;
    for (var i = 0; i < g.starBase.length; i++){
      particleRA(g.starBase[i], g.starAngle0[i], g.starSeed[i], t, g.spin, _ra);
      var rot = _ra.angle + elapsed * 0.015 * g.spin;
      sArr[i*3]   = _center.x + _ra.radius * Math.cos(rot);
      sArr[i*3+1] = _center.y + g.starHeight[i];
      sArr[i*3+2] = _center.z + _ra.radius * Math.sin(rot);
    }
    starAttr.needsUpdate = true;

    var dustAttr = g.dust.geometry.attributes.position;
    var dArr = dustAttr.array;
    for (var j = 0; j < g.dustBase.length; j++){
      particleRA(g.dustBase[j], g.dustAngle0[j], g.dustSeed[j], t, g.spin, _ra);
      var rot2 = _ra.angle + elapsed * 0.015 * g.spin;
      dArr[j*3]   = _center.x + _ra.radius * Math.cos(rot2);
      dArr[j*3+1] = _center.y + g.dustHeight[j];
      dArr[j*3+2] = _center.z + _ra.radius * Math.sin(rot2);
    }
    dustAttr.needsUpdate = true;

    var laneAttr = g.lane.geometry.attributes.position;
    var lArr = laneAttr.array;
    for (var k = 0; k < g.laneBase.length; k++){
      particleRA(g.laneBase[k], g.laneAngle0[k], g.laneSeed[k], t, g.spin, _ra);
      var rot3 = _ra.angle + elapsed * 0.015 * g.spin;
      lArr[k*3]   = _center.x + _ra.radius * Math.cos(rot3);
      lArr[k*3+1] = _center.y + g.laneHeight[k];
      lArr[k*3+2] = _center.z + _ra.radius * Math.sin(rot3);
    }
    laneAttr.needsUpdate = true;
  }

  function buildStarfield(){
    var count = tierConfig.starfield;
    var geo = new THREE.BufferGeometry();
    var pos = new Float32Array(count * 3);
    for (var i = 0; i < count; i++){
      var r = 80 + Math.random() * 120;
      var theta = Math.random() * Math.PI * 2;
      var phi = Math.acos((Math.random() * 2) - 1);
      pos[i*3]   = r * Math.sin(phi) * Math.cos(theta);
      pos[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
      pos[i*3+2] = r * Math.cos(phi);
    }
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    var mat = new THREE.PointsMaterial({ size: 0.24, color: 0xaaaaaa, transparent: true, opacity: 0.45, depthWrite: false });
    starfield = new THREE.Points(geo, mat);
    scene.add(starfield);
  }

  function buildDebris(){
    var count = tierConfig.debris;
    var geo = new THREE.BufferGeometry();
    var pos = new Float32Array(count * 3);
    for (var i = 0; i < count; i++){
      var r = 24 + Math.random() * 30;
      var theta = Math.random() * Math.PI * 2;
      var phi = Math.acos((Math.random() * 2) - 1);
      pos[i*3]   = r * Math.sin(phi) * Math.cos(theta);
      pos[i*3+1] = r * Math.sin(phi) * Math.sin(theta) * 0.35;
      pos[i*3+2] = r * Math.cos(phi);
    }
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    var mat = new THREE.PointsMaterial({ size: 0.14, color: 0xff5555, transparent: true, opacity: 0.35, depthWrite: false });
    debrisField = new THREE.Points(geo, mat);
    scene.add(debrisField);
  }

  function buildBlackHole(){
    var horizonGeo = new THREE.SphereGeometry(1, 32, 32);
    var horizonMat = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0 });
    var horizon = new THREE.Mesh(horizonGeo, horizonMat);

    var innerRingGeo = new THREE.RingGeometry(1.2, 1.8, 64);
    var innerRingMat = new THREE.MeshBasicMaterial({ color: 0xff2b2b, side: THREE.DoubleSide, transparent: true, opacity: 0 });
    var innerRing = new THREE.Mesh(innerRingGeo, innerRingMat);
    innerRing.rotation.x = Math.PI / 2.3;

    var outerRingGeo = new THREE.RingGeometry(2.2, 3.0, 64);
    var outerRingMat = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide, transparent: true, opacity: 0 });
    var outerRing = new THREE.Mesh(outerRingGeo, outerRingMat);
    outerRing.rotation.x = Math.PI / 2.1;

    blackHoleGroup = new THREE.Group();
    blackHoleGroup.add(horizon, innerRing, outerRing);
    blackHoleGroup.userData = { horizonMat: horizonMat, innerRingMat: innerRingMat, outerRingMat: outerRingMat, innerRing: innerRing, outerRing: outerRing };
    scene.add(blackHoleGroup);
  }

  function updateBlackHole(t, elapsed){
    var ud = blackHoleGroup.userData;
    var tl = CONFIG.timeline;

    var birth = smoothstep(tl.blackHoleBirth[0], tl.blackHoleBirth[1], t);
    var grow = birth + smoothstep(tl.consumption[0], tl.consumption[1], t) * 0.8;
    var scale = lerp(0.25, 1.6, clamp01(grow));
    var opacity = clamp01(birth);
    var spinSpeed = 1, shake = 0;

    if (t >= tl.collapse[0] && t < tl.collapse[1]){
      var p1 = smoothstep(tl.collapse[0], tl.collapse[1], t);
      scale = lerp(scale, scale * 0.4, p1);
      opacity = 1;
      spinSpeed = lerp(1, 4, p1);
      shake = Math.sin(elapsed * 40) * p1 * 0.15;
    }
    if (t >= tl.destruction[0]){
      var p2 = smoothstep(tl.destruction[0], tl.destruction[0] + 0.4, t);
      scale = lerp(scale, 0, p2);
      opacity = clamp01((1 - p2) );
    }
    if (t >= tl.destruction[1]){ scale = 0; opacity = 0; }

    blackHoleGroup.scale.setScalar(Math.max(scale, 0.0001));
    ud.horizonMat.opacity = opacity;
    ud.innerRingMat.opacity = opacity * 0.9;
    ud.outerRingMat.opacity = opacity * 0.7;

    ud.innerRing.rotation.z = elapsed * 2 * spinSpeed;
    ud.outerRing.rotation.z = -elapsed * 0.8 * spinSpeed;
    blackHoleGroup.position.set(shake, shake * 0.6, 0);
  }

  function buildShockwave(){
    var geo = new THREE.RingGeometry(0.1, 0.3, 64);
    var mat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0, side: THREE.DoubleSide });
    shockwaveMesh = new THREE.Mesh(geo, mat);
    shockwaveMesh.rotation.x = Math.PI / 2;
    scene.add(shockwaveMesh);

    flashLight = new THREE.PointLight(0xffffff, 0, 100);
    scene.add(flashLight);
  }

  function updateShockwave(t){
    var tl = CONFIG.timeline;
    var mid = tl.destruction[0] + (tl.destruction[1] - tl.destruction[0]) * 0.5;
    var rise = smoothstep(tl.destruction[0], mid, t);
    var fall = 1 - smoothstep(mid, tl.destruction[1], t);
    var strength = clamp01(rise) * clamp01(fall);
    var growth = clamp01(smoothstep(tl.destruction[0], tl.destruction[1], t));
    var scale = lerp(0.1, 30, growth);
    shockwaveMesh.scale.setScalar(Math.max(scale, 0.001));
    shockwaveMesh.material.opacity = strength;
    flashLight.intensity = strength * 8;
  }

  function onPointerMove(e){
    targetMouseX = (e.clientX / window.innerWidth) - 0.5;
    targetMouseY = (e.clientY / window.innerHeight) - 0.5;
  }
  function onTouchMove(e){
    if (!e.touches || !e.touches[0]) return;
    targetMouseX = (e.touches[0].clientX / window.innerWidth) - 0.5;
    targetMouseY = (e.touches[0].clientY / window.innerHeight) - 0.5;
  }

  function updateCamera(t){
    mouseX = lerp(mouseX, targetMouseX, 0.05);
    mouseY = lerp(mouseY, targetMouseY, 0.05);

    var tl = CONFIG.timeline;
    var approachPush = smoothstep(tl.approach[0], tl.megaHold[1], t) * 6;
    var consumptionPush = smoothstep(tl.consumption[0], tl.consumption[1], t) * 4;
    var destructPull = smoothstep(tl.destruction[0], tl.destruction[1], t) * 8;
    var darknessEase = smoothstep(tl.darkness[0], tl.darkness[1], t);

    // dolly now moves in height (bird's-eye descends/ascends) since the
    // camera looks down at the galaxy plane rather than straight across it
    var dollyH = 38 - approachPush - consumptionPush + destructPull;
    dollyH = lerp(dollyH, 38, darknessEase);

    camera.position.x = mouseX * 5;
    camera.position.z = 6 + mouseY * 5;
    camera.position.y = dollyH;
    camera.lookAt(0, 0, 0);
  }

  function onResize(){
    if (!webglAvailable) return;
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }

  function onVisibilityChange(){
    if (!webglAvailable || reducedMotion) return;
    if (document.hidden){
      if (rafId) cancelAnimationFrame(rafId);
      rafId = null;
    } else if (!rafId){
      animate();
    }
  }

  function animate(){
    rafId = requestAnimationFrame(animate);
    var elapsed = clock.getElapsedTime();
    var t = elapsed % CONFIG.loopDuration;

    updateGalaxyPositions(galaxy1, t, elapsed);
    updateGalaxyPositions(galaxy2, t, elapsed);
    updateBlackHole(t, elapsed);
    updateShockwave(t);
    updateCamera(t);

    starfield.rotation.y = elapsed * 0.005;
    debrisField.rotation.y = -elapsed * 0.02;

    renderer.render(scene, camera);
  }

  function buildCommonScene(){
    tier = detectTier();
    tierConfig = PERF_TIERS[tier];

    var canvas = document.getElementById('bg-canvas');
    renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
    renderer.setPixelRatio(Math.min(tierConfig.dpr, window.devicePixelRatio || 1));
    renderer.setSize(window.innerWidth, window.innerHeight);

    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    // near-top-down "bird's eye" cinematic angle — the galaxies' spiral arms
    // live in the XZ plane, so viewing steeply from above shows the full
    // spiral structure instead of a flat edge-on silhouette.
    camera.position.set(0, 38, 6);

    buildStarfield();
    buildDebris();

    galaxy1 = buildGalaxy({ spin: 1, armCount: 2, colorCore: 0xfff2df, colorArmHot: 0xcfe0ff, colorArmCool: 0xdedee2, offset: new THREE.Vector3(-14, 2, -6) });
    galaxy2 = buildGalaxy({ spin: -1, armCount: 3, colorCore: 0xfff2df, colorArmHot: 0xd8e6ff, colorArmCool: 0xe4e4e8, offset: new THREE.Vector3(14, -2, 6) });
    scene.add(galaxy1.points, galaxy1.dust, galaxy1.lane, galaxy2.points, galaxy2.dust, galaxy2.lane);

    buildBlackHole();
    buildShockwave();
  }

  function initCosmicFull(){
    webglAvailable = detectWebGL() && (typeof THREE !== 'undefined');
    if (!webglAvailable){
      document.getElementById('bg-canvas').hidden = true;
      document.getElementById('css-fallback-bg').hidden = false;
      return;
    }
    buildCommonScene();
    clock = new THREE.Clock();
    window.addEventListener('resize', onResize);
    window.addEventListener('pointermove', onPointerMove, { passive: true });
    window.addEventListener('touchmove', onTouchMove, { passive: true });
    document.addEventListener('visibilitychange', onVisibilityChange);
  }

  function initCosmicReducedMotion(){
    webglAvailable = detectWebGL() && (typeof THREE !== 'undefined');
    if (!webglAvailable){
      document.getElementById('bg-canvas').hidden = true;
      document.getElementById('css-fallback-bg').hidden = false;
      return;
    }
    buildCommonScene();
    camera.position.set(0, 32, 5);
    camera.lookAt(0, 0, 0);

    var STATIC_T = CONFIG.timeline.megaHold[0] + 1.5; // beautiful merged-galaxy hold moment
    updateGalaxyPositions(galaxy1, STATIC_T, 0);
    updateGalaxyPositions(galaxy2, STATIC_T, 0);
    updateBlackHole(STATIC_T, 0);
    updateShockwave(STATIC_T);
    renderer.render(scene, camera);

    window.addEventListener('resize', function(){
      onResize();
      renderer.render(scene, camera);
    });
  }

  function startCosmic(){
    if (!webglAvailable || reducedMotion) return; // reduced-motion already rendered its static frame
    clock.start();
    animate();
  }

  /* =========================================================
     7. BOOTSTRAP
     ========================================================= */
  function init(){
    if (reducedMotion){
      initCosmicReducedMotion();
    } else {
      initCosmicFull();
    }
    runIntro();
  }

  if (document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
