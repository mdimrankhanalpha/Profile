<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Alpha</title>
<meta name="description" content="Alpha">
<meta name="theme-color" content="#050505">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;600;700;800&family=Sora:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#050505;
    --black-deep:#000000;
    --white:#f4f4f2;
    --white-dim:rgba(244,244,242,0.55);
    --red:#ff1d3a;
    --red-dim:rgba(255,29,58,0.35);
    --ease-out:cubic-bezier(.16,.84,.28,1);
    --ease-spring:cubic-bezier(.22,1.2,.36,1);
    --surface:rgba(255,255,255,0.035);
    --border:rgba(255,255,255,0.08);
  }

  *{box-sizing:border-box;margin:0;padding:0;}

  html,body{
    height:100%;
    background:var(--black);
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
  }

  body{
    font-family:'Sora',system-ui,sans-serif;
    color:var(--white);
    position:relative;
    touch-action:pan-y;
  }

  /* ================= 3D CANVAS ================= */
  #scene-canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:1;
    display:block;
  }

  #scene-canvas.hidden{ display:none; }

  /* fallback (no webgl) */
  #fallback-bg{
    position:fixed;
    inset:0;
    z-index:1;
    background:
      radial-gradient(ellipse at 50% 20%, rgba(255,29,58,0.08), transparent 55%),
      radial-gradient(ellipse at 50% 100%, rgba(255,255,255,0.04), transparent 60%),
      var(--black);
    display:none;
  }
  #fallback-bg.active{ display:block; }

  /* ================= INTRO ================= */
  #intro{
    position:fixed;
    inset:0;
    z-index:50;
    background:var(--black-deep);
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:1;
  }

  #intro.done{
    pointer-events:none;
  }

  #intro-canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
  }

  #intro-emblem-wrap{
    position:relative;
    width:min(46vw,220px);
    height:min(46vw,220px);
    opacity:0;
    filter:drop-shadow(0 0 0 rgba(255,29,58,0));
    will-change:transform,opacity,filter;
  }

  #intro-emblem-wrap svg{
    width:100%;
    height:100%;
    display:block;
    overflow:visible;
  }

  #skip-intro{
    position:absolute;
    bottom:max(28px, env(safe-area-inset-bottom));
    right:24px;
    background:transparent;
    border:1px solid var(--border);
    color:var(--white-dim);
    font-family:'Sora',sans-serif;
    font-size:12px;
    letter-spacing:0.04em;
    padding:9px 16px;
    border-radius:100px;
    cursor:pointer;
    opacity:0;
    transition:opacity .4s var(--ease-out), border-color .25s, color .25s;
    z-index:5;
  }
  #skip-intro.show{ opacity:1; }
  #skip-intro:hover, #skip-intro:focus-visible{
    border-color:var(--red-dim);
    color:var(--white);
    outline:none;
  }

  /* ================= MAIN INTERFACE ================= */
  #app{
    position:fixed;
    inset:0;
    z-index:10;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    opacity:0;
  }

  #app.visible{
    opacity:1;
  }

  #profile-universe{
    width:100%;
    max-width:460px;
    position:relative;
  }

  #profile-list{
    list-style:none;
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .profile-item{
    opacity:0;
    transform:translateY(18px) scale(0.985);
  }

  .profile-link{
    position:relative;
    display:flex;
    align-items:center;
    gap:16px;
    width:100%;
    padding:14px 18px;
    border-radius:18px;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015)),
      var(--black);
    border:1px solid var(--border);
    text-decoration:none;
    color:var(--white);
    cursor:pointer;
    overflow:hidden;
    transform-style:preserve-3d;
    -webkit-user-select:none;
    user-select:none;
    transition:
      border-color .35s var(--ease-out),
      background .35s var(--ease-out),
      box-shadow .4s var(--ease-out),
      transform .35s var(--ease-spring);
    box-shadow:0 18px 40px -22px rgba(0,0,0,0.9);
  }

  .profile-link::before{
    content:'';
    position:absolute;
    inset:0;
    border-radius:inherit;
    background:radial-gradient(140px 90px at var(--mx,50%) var(--my,50%), rgba(255,29,58,0.14), transparent 65%);
    opacity:0;
    transition:opacity .35s ease;
    pointer-events:none;
  }

  .profile-link:hover,
  .profile-link:focus-visible,
  .profile-link.touch-active{
    border-color:rgba(255,29,58,0.4);
    box-shadow:0 22px 50px -20px rgba(255,29,58,0.22), 0 0 0 1px rgba(255,29,58,0.08) inset;
  }

  .profile-link:hover::before,
  .profile-link:focus-visible::before{
    opacity:1;
  }

  .profile-link:focus-visible{
    outline:2px solid var(--red);
    outline-offset:3px;
  }

  .profile-link.touch-active{
    transform:scale(0.975);
  }

  .avatar{
    position:relative;
    width:52px;
    height:52px;
    min-width:52px;
    border-radius:50%;
    background:var(--black-deep);
    border:1px solid rgba(255,255,255,0.14);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    transition:border-color .35s var(--ease-out), box-shadow .35s var(--ease-out);
  }

  .profile-link:hover .avatar,
  .profile-link:focus-visible .avatar{
    border-color:rgba(255,29,58,0.65);
    box-shadow:0 0 0 3px rgba(255,29,58,0.12), 0 0 18px -2px rgba(255,29,58,0.45);
  }

  .avatar svg{
    width:66%;
    height:66%;
    transition:transform .5s var(--ease-spring);
  }

  .profile-link:hover .avatar svg,
  .profile-link:focus-visible .avatar svg{
    transform:scale(1.08);
  }

  .profile-name{
    flex:1;
    font-family:'Syne',sans-serif;
    font-weight:700;
    font-size:17px;
    letter-spacing:0.01em;
    line-height:1;
  }

  .chevron{
    flex-shrink:0;
    color:var(--white-dim);
    transition:transform .35s var(--ease-spring), color .35s var(--ease-out);
  }

  .profile-link:hover .chevron,
  .profile-link:focus-visible .chevron{
    transform:translateX(4px);
    color:var(--red);
  }

  @media (min-width:720px){
    .profile-link{ padding:18px 24px; border-radius:20px; }
    .avatar{ width:60px; height:60px; min-width:60px; }
    .profile-name{ font-size:19px; }
  }

  /* ================= REDUCED MOTION ================= */
  @media (prefers-reduced-motion: reduce){
    *{
      animation-duration:0.01ms !important;
      animation-iteration-count:1 !important;
      transition-duration:0.01ms !important;
    }
  }

  .sr-only{
    position:absolute;
    width:1px;height:1px;
    overflow:hidden;
    clip:rect(0,0,0,0);
    white-space:nowrap;
  }
</style>
</head>
<body>

<a href="#profile-list" class="sr-only">Skip to profile list</a>

<canvas id="scene-canvas" aria-hidden="true"></canvas>
<div id="fallback-bg" aria-hidden="true"></div>

<div id="intro" role="presentation">
  <canvas id="intro-canvas" aria-hidden="true"></canvas>
  <div id="intro-emblem-wrap"></div>
  <button id="skip-intro" type="button" aria-label="Skip intro">Skip</button>
</div>

<main id="app">
  <div id="profile-universe">
    <ul id="profile-list"></ul>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  "use strict";

  /* ============================================================
     1. PROFILE DATA — UNCHANGED ARCHITECTURE
     Adding profile #2 (or #1,000,000,000,000th) is still only
     ever a push to this array. Nothing below ever reads from or
     writes to the cosmic engine, and the cosmic engine never
     reads from this array either — fully decoupled.
  ============================================================ */
  var profiles = [
    {
      id: "alpha",
      name: "Alpha",
      image: "https://raw.githubusercontent.com/mdimrankhanalpha/Alpha/main/file_0000000012b081fa9718ddb092393a0e.png",
      url: "https://mdimrankhanalpha.github.io/Alpha-/"
    }
  ];

  /* ============================================================
     2. PERFORMANCE MANAGER
  ============================================================ */
  var reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  var dpr = Math.min(window.devicePixelRatio || 1, 2);

  function detectTier(){
    var mem = navigator.deviceMemory || 4;
    var cores = navigator.hardwareConcurrency || 4;
    var w = window.innerWidth;
    if (mem <= 2 || cores <= 2) return 'LOW';
    if (mem <= 4 || w < 480) return 'MEDIUM';
    return 'HIGH';
  }
  var tier = reducedMotion ? 'LOW' : detectTier();

  var TIER_CONFIG = {
    HIGH:   { far: 220, near: 36, structures: 4, galaxyStars: 480, galaxyDust: 150, dpr: dpr },
    MEDIUM: { far: 110, near: 18, structures: 2, galaxyStars: 240, galaxyDust: 70,  dpr: Math.min(dpr, 1.5) },
    LOW:    { far: 50,  near: 8,  structures: 1, galaxyStars: 110, galaxyDust: 30,  dpr: 1 }
  };
  var cfg = TIER_CONFIG[tier];

  var webglSupported = (function(){
    try{
      var c = document.createElement('canvas');
      return !!(window.WebGLRenderingContext && (c.getContext('webgl') || c.getContext('experimental-webgl')));
    }catch(e){ return false; }
  })();

  function clamp01(x){ return x < 0 ? 0 : (x > 1 ? 1 : x); }
  function smoothstep(edge0, edge1, x){
    var t = clamp01((x - edge0) / (edge1 - edge0));
    return t * t * (3 - 2 * t);
  }
  function lerp(a, b, t){ return a + (b - a) * t; }
  function rotateXZ(vec, angle){
    var c = Math.cos(angle), s = Math.sin(angle);
    return { x: vec.x * c - vec.z * s, y: vec.y, z: vec.x * s + vec.z * c };
  }

  /* ============================================================
     3. EMBLEM (unchanged — intro mark + avatar fallback)
  ============================================================ */
  function mountEmblem(targetEl){
    var tpl = document.getElementById('emblem-template');
    var clone = tpl.content.cloneNode(true);
    targetEl.appendChild(clone);
    return targetEl.querySelector('svg');
  }

  /* ============================================================
     4. COSMIC EVENT BUS  (audio-ready architecture)
     Inert by default — nothing subscribes today. Exposed so a
     future feature (sound design, haptics, analytics) can hook
     into phase transitions without touching the engine itself.
  ============================================================ */
  var CosmicEvents = (function(){
    var listeners = {};
    function on(name, cb){
      if(!listeners[name]) listeners[name] = [];
      listeners[name].push(cb);
    }
    function emit(name){
      var cbs = listeners[name];
      if(!cbs) return;
      for(var i=0;i<cbs.length;i++){ try{ cbs[i](); }catch(e){} }
    }
    return { on: on, emit: emit };
  })();
  window.AlphaCosmicEvents = { on: CosmicEvents.on };

  /* ============================================================
     5. COSMIC CONFIG — single source of truth for all timing.
     Everything below derives from these second-marks; nothing
     else in the file hard-codes a timing number.
  ============================================================ */
  var COSMIC_CONFIG = (function(){
    var LOOP_SECONDS = 46;
    var marks = {
      voidEnd: 5,        // cosmic void -> galaxy birth begins
      formationEnd: 12,   // both galaxies fully formed
      approachEnd: 20,    // gravitational approach underway
      collisionEnd: 27,   // coiling/merger complete
      megaHoldEnd: 30,    // cinematic hold on the giant merged galaxy
      bhBirthEnd: 33,     // black hole finished forming
      consumptionEnd: 40, // galaxy fully devoured
      collapseEnd: 43,    // black hole instability/contraction complete
      destructEnd: 44,    // self-destruction + flash complete
      darknessEnd: 46     // hold, then loop
    };
    var F = {};
    for(var k in marks){ F[k] = marks[k] / LOOP_SECONDS; }
    return { LOOP_SECONDS: LOOP_SECONDS, marks: marks, F: F };
  })();

  /* ============================================================
     6. 3D ENVIRONMENT
  ============================================================ */
  var Scene3D = (function(){
    var scene, camera, renderer, clock;
    var farField, nearField, structureGroup;
    var galaxyA, galaxyB;
    var blackHole, shockwave, flashLight, rimLight, rimLight2;
    var canvas = document.getElementById('scene-canvas');
    var mouseX = 0, mouseY = 0, targetMouseX = 0, targetMouseY = 0;
    var running = false;
    var rafId = null;
    var lastPhaseKey = null;

    var F = COSMIC_CONFIG.F;
    var LOOP_SECONDS = COSMIC_CONFIG.LOOP_SECONDS;

    var GALAXY_RADIUS = 9.5;
    var COM_CENTER = { x: 0, y: -1, z: -18 };
    var START_A = { x: -19, y: 4, z: -14 };
    var START_B = { x: 19, y: -4, z: -22 };
    var OFFSET_A = { x: START_A.x - COM_CENTER.x, y: START_A.y - COM_CENTER.y, z: START_A.z - COM_CENTER.z };
    var OFFSET_B = { x: START_B.x - COM_CENTER.x, y: START_B.y - COM_CENTER.y, z: START_B.z - COM_CENTER.z };
    var ORBIT_TURNS = 1.75;

    function init(){
      if(!webglSupported){
        document.getElementById('fallback-bg').classList.add('active');
        canvas.classList.add('hidden');
        return false;
      }

      scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x000000, 0.036);

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 220);
      camera.position.set(0, 0, 34);

      renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: false, powerPreference: 'high-performance' });
      renderer.setPixelRatio(cfg.dpr);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setClearColor(0x050505, 1);

      clock = new THREE.Clock();

      buildLighting();
      buildStarLayers();
      buildStructures();
      galaxyA = makeGalaxyPopulation(START_A, 3, 1);
      galaxyB = makeGalaxyPopulation(START_B, 2, -1);
      buildBlackHole();

      window.addEventListener('resize', onResize, { passive: true });
      if(!isTouch){
        window.addEventListener('mousemove', onMouseMove, { passive: true });
      } else {
        window.addEventListener('touchmove', onTouchMove, { passive: true });
      }

      return true;
    }

    function buildLighting(){
      var key = new THREE.DirectionalLight(0xffffff, 0.5);
      key.position.set(-6, 8, 10);
      scene.add(key);

      var ambient = new THREE.AmbientLight(0x1a1a1a, 1);
      scene.add(ambient);

      rimLight = new THREE.PointLight(0xff1d3a, 0.6, 80, 2);
      rimLight.position.set(COM_CENTER.x, COM_CENTER.y, COM_CENTER.z + 3);
      scene.add(rimLight);

      rimLight2 = new THREE.PointLight(0xff1d3a, 0.25, 60, 2);
      rimLight2.position.set(COM_CENTER.x - 6, COM_CENTER.y + 5, COM_CENTER.z + 6);
      scene.add(rimLight2);

      flashLight = new THREE.PointLight(0xffffff, 0, 100, 2);
      flashLight.position.set(COM_CENTER.x, COM_CENTER.y, COM_CENTER.z + 2);
      scene.add(flashLight);
    }

    // FAR: distant sparse starfield (deep backdrop, barely moves).
    // NEAR: a handful of closer, brighter debris points for depth.
    // Both are static point clouds that only rotate as a rigid
    // group — this gives real parallax depth without paying the
    // per-frame cost of rewriting thousands of positions.
    function buildStarLayers(){
      farField = buildStaticField(cfg.far, 130, 0.55, 0.34);
      scene.add(farField);
      nearField = buildStaticField(cfg.near, 30, 1.4, 0.6);
      nearField.position.z = 14;
      scene.add(nearField);
    }

    function buildStaticField(count, spread, size, opacity){
      var geo = new THREE.BufferGeometry();
      var positions = new Float32Array(count * 3);
      var colors = new Float32Array(count * 3);
      var white = new THREE.Color(0xf4f4f2);
      var red = new THREE.Color(0xff1d3a);
      for(var i=0;i<count;i++){
        var i3 = i*3;
        positions[i3]   = (Math.random()-0.5) * spread * 2;
        positions[i3+1] = (Math.random()-0.5) * spread * 2;
        positions[i3+2] = (Math.random()-0.5) * spread * 2 - 20;
        var c = Math.random() > 0.96 ? red : white;
        colors[i3] = c.r; colors[i3+1] = c.g; colors[i3+2] = c.b;
      }
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      var mat = new THREE.PointsMaterial({ size: size, vertexColors: true, transparent: true, opacity: opacity, sizeAttenuation: true, depthWrite: false });
      return new THREE.Points(geo, mat);
    }

    function buildStructures(){
      structureGroup = new THREE.Group();
      var count = cfg.structures;
      for(var i=0;i<count;i++){
        var ring = new THREE.TorusGeometry(6 + i*1.4, 0.025, 8, 64);
        var mat = new THREE.MeshBasicMaterial({ color: i % 2 === 0 ? 0xffffff : 0xff1d3a, transparent: true, opacity: 0.05 });
        var mesh = new THREE.Mesh(ring, mat);
        mesh.position.set((Math.random()-0.5)*50, (Math.random()-0.5)*40, -40 - Math.random()*40);
        mesh.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, Math.random()*Math.PI);
        structureGroup.add(mesh);
      }
      scene.add(structureGroup);
    }

    // Builds one galaxy's two particle populations:
    //  - "stars": core + spiral-arm + halo stars blended by radius
    //    band (denser & brighter toward the core, sparse & dim
    //    toward the halo), following a log-spiral arm formula.
    //  - "dust": a looser, dimmer, more turbulence-sensitive cloud
    //    tracing the same arms, standing in for dust lanes.
    // NOTE (honest caveat): both populations share one draw call
    // each via BufferGeometry rather than five separate meshes —
    // the visual bands (core/arm/halo) are achieved through radius
    // distribution + per-vertex color/brightness, not through
    // separate geometry, which keeps this at 60fps on low-end
    // phones while still reading as a structured galaxy.
    function makePopulation(startPos, count, arms, spinDir, isDust){
      var geo = new THREE.BufferGeometry();
      var positions = new Float32Array(count * 3);
      var colors = new Float32Array(count * 3);
      var r0 = new Float32Array(count);
      var angle0 = new Float32Array(count);
      var spin = new Float32Array(count);
      var h = new Float32Array(count);
      var turb = new Float32Array(count);

      var core = new THREE.Color(0xffffff);
      var white = new THREE.Color(0xf4f4f2);
      var dim = new THREE.Color(0xa9a9ae);
      var red = new THREE.Color(0xff2f4a);
      var duste = new THREE.Color(0x7a7a80);

      for(var i=0;i<count;i++){
        var band = Math.random();
        var radius;
        if(band < 0.12){
          radius = Math.random() * 0.12 * GALAXY_RADIUS; // dense core
        } else if(band < 0.85){
          radius = 0.12 * GALAXY_RADIUS + Math.pow(Math.random(), 0.6) * 0.73 * GALAXY_RADIUS; // arm band
        } else {
          radius = 0.85 * GALAXY_RADIUS + Math.random() * 0.5 * GALAXY_RADIUS; // sparse halo
        }
        var armIndex = i % arms;
        var baseAngle = (armIndex / arms) * Math.PI * 2 + (Math.random() - 0.5) * (isDust ? 0.6 : 0.35);
        var wind = 2.5;
        r0[i] = radius;
        angle0[i] = baseAngle + wind * (radius / GALAXY_RADIUS) + (isDust ? (Math.random()-0.5)*0.5 : 0);
        spin[i] = spinDir * (0.5 / (0.4 + radius * 0.07));
        h[i] = (Math.random() - 0.5) * (0.4 + (GALAXY_RADIUS - Math.min(radius,GALAXY_RADIUS)) * 0.03) * (isDust ? 1.6 : 1);
        turb[i] = (Math.random() - 0.5) * 2;

        var i3 = i*3;
        positions[i3] = startPos.x; positions[i3+1] = startPos.y; positions[i3+2] = startPos.z;

        var c;
        if(isDust){
          c = duste;
        } else if(band < 0.12){
          c = core;
        } else {
          var roll = Math.random();
          c = roll > 0.93 ? red : (roll > 0.55 ? dim : white);
        }
        colors[i3] = c.r; colors[i3+1] = c.g; colors[i3+2] = c.b;
      }

      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      var mat = new THREE.PointsMaterial({
        size: isDust ? 0.16 : 0.13,
        vertexColors: true,
        transparent: true,
        opacity: 0,
        sizeAttenuation: true,
        depthWrite: false
      });

      var points = new THREE.Points(geo, mat);
      return { points: points, mat: mat, positions: positions, r0: r0, angle0: angle0, spin: spin, h: h, turb: turb, count: count, isDust: isDust, baseSize: isDust ? 0.16 : 0.13, baseOpacity: isDust ? 0.32 : 0.85 };
    }

    function makeGalaxyPopulation(startPos, arms, spinDir){
      var stars = makePopulation(startPos, cfg.galaxyStars, arms, spinDir, false);
      var dust = makePopulation(startPos, cfg.galaxyDust, arms, spinDir, true);
      scene.add(stars.points);
      scene.add(dust.points);
      return { stars: stars, dust: dust, offset: startPos === START_A ? OFFSET_A : OFFSET_B };
    }

    function buildBlackHole(){
      var group = new THREE.Group();

      var horizon = new THREE.Mesh(
        new THREE.SphereGeometry(0.5, 24, 24),
        new THREE.MeshBasicMaterial({ color: 0x000000 })
      );
      group.add(horizon);

      var innerDisk = new THREE.Mesh(
        new THREE.RingGeometry(0.6, 1.25, 48),
        new THREE.MeshBasicMaterial({ color: 0xff2f4a, transparent: true, opacity: 0, side: THREE.DoubleSide })
      );
      innerDisk.rotation.x = Math.PI / 2.3;
      group.add(innerDisk);

      var outerDisk = new THREE.Mesh(
        new THREE.RingGeometry(1.35, 2.0, 48),
        new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0, side: THREE.DoubleSide })
      );
      outerDisk.rotation.x = Math.PI / 2.3;
      group.add(outerDisk);

      group.position.set(COM_CENTER.x, COM_CENTER.y, COM_CENTER.z);
      group.visible = false;
      scene.add(group);

      var shock = new THREE.Mesh(
        new THREE.RingGeometry(0.12, 0.34, 64),
        new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0, side: THREE.DoubleSide })
      );
      shock.position.set(COM_CENTER.x, COM_CENTER.y, COM_CENTER.z);
      shock.visible = false;
      scene.add(shock);
      shockwave = shock;

      blackHole = { group: group, horizon: horizon, inner: innerDisk, outer: outerDisk };
    }

    // Shared update path for a galaxy's star OR dust population.
    // Position is a pure function of (t, elapsed) — nothing is
    // accumulated frame-to-frame, so the cycle can never drift.
    function updatePopulation(pop, elapsed, centerNow, existenceFactor, turbFactor, pullT, turbMultiplier){
      var extraSpin = pullT * pullT * 9;
      var radiusFactor = 1 - pullT;
      var pos = pop.positions;
      for(var i=0;i<pop.count;i++){
        var angle = pop.angle0[i] + pop.spin[i] * elapsed + extraSpin;
        var turbAmt = turbFactor * pop.turb[i] * turbMultiplier;
        var radiusNow = Math.max(0, pop.r0[i] * radiusFactor * (1 + turbAmt));

        var i3 = i*3;
        pos[i3]   = centerNow.x + Math.cos(angle) * radiusNow;
        pos[i3+1] = centerNow.y + pop.h[i] * radiusFactor + Math.sin(angle * 0.5) * 0.3 * radiusFactor;
        pos[i3+2] = centerNow.z + Math.sin(angle) * radiusNow * 0.6;
      }
      pop.points.geometry.attributes.position.needsUpdate = true;
      pop.mat.opacity = pop.baseOpacity * existenceFactor;
      pop.mat.size = pop.baseSize * (1 - pullT * 0.7);
    }

    function currentPhaseKey(t){
      if(t < F.voidEnd) return 'void';
      if(t < F.formationEnd) return 'formation';
      if(t < F.collisionEnd) return 'approach';
      if(t < F.megaHoldEnd) return 'megaHold';
      if(t < F.bhBirthEnd) return 'bhBirth';
      if(t < F.consumptionEnd) return 'consumption';
      if(t < F.collapseEnd) return 'collapse';
      if(t < F.destructEnd) return 'destruction';
      return 'darkness';
    }

    var PHASE_EVENTS = {
      formation: 'onGalaxyBirth',
      approach: 'onGravitationalApproach',
      megaHold: 'onGalaxyMerge',
      bhBirth: 'onBlackHoleBirth',
      consumption: 'onConsumption',
      collapse: 'onBlackHoleCollapse',
      destruction: 'onBlackHoleDeath',
      void: 'onCosmicRebirth'
    };

    function maybeEmitPhaseEvent(t){
      var key = currentPhaseKey(t);
      if(key !== lastPhaseKey){
        lastPhaseKey = key;
        var evt = PHASE_EVENTS[key];
        if(evt) CosmicEvents.emit(evt);
      }
    }

    function updateCosmicLoop(elapsed, isStaticFrame){
      var t = (elapsed % LOOP_SECONDS) / LOOP_SECONDS;
      if(!isStaticFrame) maybeEmitPhaseEvent(t);

      // --- Galaxy birth-in & consumption (shared existence curve)
      var existenceBirth = smoothstep(F.voidEnd, F.formationEnd, t);
      var pullT = smoothstep(F.bhBirthEnd, F.consumptionEnd, t);
      var existenceFactor = existenceBirth * (1 - pullT);

      // --- Gravitational inspiral: shrinking separation + growing
      // orbital angle (quadratic ease so angular velocity visibly
      // accelerates as the galaxies close in — "increasingly
      // unstable" per the brief), converging at collisionEnd.
      var approachProgress = smoothstep(F.formationEnd, F.collisionEnd, t);
      var orbitAngle = approachProgress * approachProgress * ORBIT_TURNS * Math.PI * 2;
      var sepScale = 1 - approachProgress;

      var rotatedA = rotateXZ({ x: OFFSET_A.x * sepScale, y: OFFSET_A.y, z: OFFSET_A.z * sepScale }, orbitAngle);
      var rotatedB = rotateXZ({ x: OFFSET_B.x * sepScale, y: OFFSET_B.y, z: OFFSET_B.z * sepScale }, orbitAngle);
      var centerA = { x: COM_CENTER.x + rotatedA.x, y: lerp(START_A.y, COM_CENTER.y, approachProgress), z: COM_CENTER.z + rotatedA.z };
      var centerB = { x: COM_CENTER.x + rotatedB.x, y: lerp(START_B.y, COM_CENTER.y, approachProgress), z: COM_CENTER.z + rotatedB.z };

      // --- Turbulence spikes through the close encounter, settles
      // by the giant-galaxy hold.
      var mergeTurb = smoothstep(F.approachEnd, F.collisionEnd, t) * (1 - smoothstep(F.collisionEnd, F.megaHoldEnd, t));

      updatePopulation(galaxyA.stars, elapsed, centerA, existenceFactor, mergeTurb, pullT, 0.55);
      updatePopulation(galaxyA.dust, elapsed, centerA, existenceFactor, mergeTurb, pullT, 0.9);
      updatePopulation(galaxyB.stars, elapsed, centerB, existenceFactor, mergeTurb, pullT, 0.55);
      updatePopulation(galaxyB.dust, elapsed, centerB, existenceFactor, mergeTurb, pullT, 0.9);

      // --- Black hole lifecycle: birth -> feed -> collapse -> implode -> flash -> darkness
      var growthBirth = smoothstep(F.megaHoldEnd, F.bhBirthEnd, t);
      var growthFeed = smoothstep(F.bhBirthEnd, F.consumptionEnd, t) * 0.7;
      var shrinkCollapse = smoothstep(F.consumptionEnd, F.collapseEnd, t) * 0.35;
      var implodeSplit = F.collapseEnd + (F.destructEnd - F.collapseEnd) * 0.55;
      var implode = smoothstep(F.collapseEnd, implodeSplit, t);
      var bhScaleRaw = Math.max(0, growthBirth + growthFeed - shrinkCollapse) * (1 - implode);
      var bhScale = Math.min(bhScaleRaw, 1.6); // cap growth so opacity/scale stay in sane, intentional bounds

      var flashStart = F.collapseEnd + (F.destructEnd - F.collapseEnd) * 0.5;
      var flashPeak = F.collapseEnd + (F.destructEnd - F.collapseEnd) * 0.78;
      var flashRise = smoothstep(flashStart, flashPeak, t);
      var flashFall = 1 - smoothstep(flashPeak, F.destructEnd, t);
      var flash = flashRise * flashFall;

      var collapseBoost = smoothstep(F.consumptionEnd, F.collapseEnd, t) * 7;
      var shakeAmt = smoothstep(F.consumptionEnd, F.collapseEnd, t) * 0.05;
      var shakeX = isStaticFrame ? 0 : Math.sin(elapsed * 41) * shakeAmt;
      var shakeY = isStaticFrame ? 0 : Math.cos(elapsed * 37) * shakeAmt;

      blackHole.group.visible = bhScale > 0.01;
      blackHole.group.scale.setScalar(0.35 + bhScale * 2.3);
      blackHole.group.position.set(COM_CENTER.x + shakeX, COM_CENTER.y + shakeY, COM_CENTER.z);
      blackHole.inner.material.opacity = Math.min(1, bhScale * 0.85);
      blackHole.outer.material.opacity = Math.min(1, bhScale * 0.45);
      var diskSpeed = 1.3 + bhScale * 1.4 + collapseBoost;
      blackHole.inner.rotation.z = elapsed * diskSpeed;
      blackHole.outer.rotation.z = -elapsed * (diskSpeed * 0.6);

      shockwave.visible = flash > 0.01;
      shockwave.scale.setScalar(1 + flash * 16);
      shockwave.material.opacity = flash * 0.6;

      rimLight.intensity = 0.6 + bhScale * 3.2 + collapseBoost * 0.3;
      rimLight2.intensity = 0.25 + bhScale * 1.2;
      flashLight.intensity = flash * 9;

      return { existenceFactor: existenceFactor, bhScale: bhScale, flash: flash, approachProgress: approachProgress };
    }

    function onResize(){
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function onMouseMove(e){
      targetMouseX = (e.clientX / window.innerWidth - 0.5);
      targetMouseY = (e.clientY / window.innerHeight - 0.5);
    }

    function onTouchMove(e){
      if(!e.touches || !e.touches[0]) return;
      targetMouseX = (e.touches[0].clientX / window.innerWidth - 0.5);
      targetMouseY = (e.touches[0].clientY / window.innerHeight - 0.5);
    }

    // Cinematic camera dolly, purely a function of t — additive on
    // top of the mouse-parallax offset, never replacing it.
    function cameraCinematicOffset(t){
      var pushIn = smoothstep(F.approachEnd, F.collisionEnd, t) * 3;
      var pushDeeper = smoothstep(F.bhBirthEnd, F.consumptionEnd, t) * 5;
      var pullBack = smoothstep(F.collapseEnd, F.destructEnd, t) * 2.5 * (1 - smoothstep(F.destructEnd, F.darknessEnd, t));
      var returnToVoid = 1 - smoothstep(F.destructEnd, F.darknessEnd, t);
      var z = -(pushIn + pushDeeper) * returnToVoid + pullBack;
      return z;
    }

    function render(){
      if(!running) return;
      rafId = requestAnimationFrame(render);

      var dt = clock.getDelta();
      var elapsed = clock.getElapsedTime();

      mouseX += (targetMouseX - mouseX) * 0.04;
      mouseY += (targetMouseY - mouseY) * 0.04;

      if(!reducedMotion){
        var t = (elapsed % LOOP_SECONDS) / LOOP_SECONDS;
        var camZ = cameraCinematicOffset(t);

        camera.position.x += (mouseX * 4 - camera.position.x) * 0.05;
        camera.position.y += (-mouseY * 3 - camera.position.y) * 0.05;
        camera.position.z += ((34 + camZ) - camera.position.z) * 0.04;
        camera.lookAt(0, 0, 0);

        if(farField) farField.rotation.y += dt * 0.004;
        if(nearField) nearField.rotation.y += dt * 0.01;
        if(structureGroup) structureGroup.rotation.y += dt * 0.005;

        updateCosmicLoop(elapsed, false);
      } else if(!Scene3D._reducedFrameDrawn){
        // Reduced motion: freeze on the giant merged galaxy — the
        // single most complete, most legible cosmic moment — with
        // no continuous animation, camera shake, or flashing.
        camera.position.set(0, 0, 30);
        camera.lookAt(0, 0, 0);
        updateCosmicLoop(COSMIC_CONFIG.marks.megaHoldEnd - 1, true);
        Scene3D._reducedFrameDrawn = true;
      }

      renderer.render(scene, camera);
    }

    function start(){
      if(!webglSupported || running) return;
      running = true;
      render();
    }

    function stop(){
      running = false;
      if(rafId) cancelAnimationFrame(rafId);
    }

    return { init: init, start: start, stop: stop, supported: function(){ return webglSupported; } };
  })();

  /* ============================================================
     7. CINEMATIC INTRO — unchanged from the previous build
  ============================================================ */
  var IntroController = (function(){
    var introEl = document.getElementById('intro');
    var emblemWrap = document.getElementById('intro-emblem-wrap');
    var skipBtn = document.getElementById('skip-intro');
    var introCanvas = document.getElementById('intro-canvas');
    var ctx = introCanvas.getContext('2d');
    var particlesArr = [];
    var rafId = null;
    var startTime = null;
    var done = false;
    var onComplete = null;

    function shouldPlay(){
      try{
        return sessionStorage.getItem('alpha_intro_seen') !== '1';
      }catch(e){ return true; }
    }

    function markSeen(){
      try{ sessionStorage.setItem('alpha_intro_seen', '1'); }catch(e){}
    }

    function resizeCanvas(){
      introCanvas.width = window.innerWidth * Math.min(window.devicePixelRatio||1, 1.5);
      introCanvas.height = window.innerHeight * Math.min(window.devicePixelRatio||1, 1.5);
    }

    function initParticles(){
      var count = reducedMotion ? 0 : (tier === 'LOW' ? 30 : 70);
      particlesArr = [];
      for(var i=0;i<count;i++){
        particlesArr.push({
          x: Math.random() * introCanvas.width,
          y: Math.random() * introCanvas.height,
          r: Math.random() * 1.4 + 0.3,
          vy: -(Math.random() * 0.15 + 0.03),
          alpha: Math.random() * 0.4,
          red: Math.random() > 0.85
        });
      }
    }

    function drawParticles(progress){
      ctx.clearRect(0,0,introCanvas.width, introCanvas.height);
      for(var i=0;i<particlesArr.length;i++){
        var p = particlesArr[i];
        p.y += p.vy;
        if(p.y < 0) p.y = introCanvas.height;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r * (introCanvas.width/window.innerWidth), 0, Math.PI*2);
        ctx.fillStyle = p.red
          ? 'rgba(255,29,58,' + (p.alpha * progress) + ')'
          : 'rgba(244,244,242,' + (p.alpha * progress) + ')';
        ctx.fill();
      }
    }

    function skip(){
      if(done) return;
      finish();
    }

    function finish(){
      if(done) return;
      done = true;
      if(rafId) cancelAnimationFrame(rafId);
      markSeen();
      introEl.style.transition = 'opacity .5s ease';
      introEl.style.opacity = '0';
      setTimeout(function(){
        introEl.classList.add('done');
        introEl.style.display = 'none';
      }, 520);
      if(onComplete) onComplete();
    }

    function runTimeline(){
      resizeCanvas();
      initParticles();
      mountEmblem(emblemWrap);

      skipBtn.classList.add('show');
      skipBtn.addEventListener('click', skip);

      startTime = performance.now();
      var DURATION = reducedMotion ? 900 : 3000;

      function frame(now){
        var t = now - startTime;
        var p = Math.min(t / DURATION, 1);

        drawParticles(Math.min(p * 2, 1));

        if(!reducedMotion){
          if(t > 300){
            var eProg = Math.min((t-300)/500, 1);
            var eased = 1 - Math.pow(1-eProg, 3);
            emblemWrap.style.opacity = eased;
            emblemWrap.style.transform = 'translateY(' + (14 - eased*14) + 'px) scale(' + (0.9 + eased*0.1) + ')';
          }
          if(t > 800 && t < 2300){
            var fp = (t-800)/1500;
            var glow = Math.sin(fp * Math.PI) * 22;
            emblemWrap.style.filter = 'drop-shadow(0 0 ' + glow + 'px rgba(255,29,58,0.55))';
            emblemWrap.style.transform = 'translateY(' + (Math.sin(fp*Math.PI*2)*3) + 'px) scale(1)';
          }
          if(t > 2300){
            var xp = Math.min((t-2300)/700, 1);
            var xEase = xp*xp;
            emblemWrap.style.transform = 'translateY(' + (-xEase*10) + 'px) scale(' + (1 + xEase*0.6) + ')';
            emblemWrap.style.opacity = String(1 - xEase);
          }
        } else {
          emblemWrap.style.opacity = '1';
        }

        if(p < 1){
          rafId = requestAnimationFrame(frame);
        } else {
          finish();
        }
      }
      rafId = requestAnimationFrame(frame);
    }

    function play(cb){
      onComplete = cb;
      if(!shouldPlay()){
        introEl.style.display = 'none';
        introEl.classList.add('done');
        done = true;
        if(cb) cb();
        return;
      }
      runTimeline();
    }

    return { play: play };
  })();

  /* ============================================================
     8. PROFILE RENDERER + VIRTUALIZATION — unchanged
  ============================================================ */
  var ProfileEngine = (function(){
    var listEl = document.getElementById('profile-list');
    var BUFFER = 8;
    var ITEM_HEIGHT_ESTIMATE = 82;
    var currentIndex = 0;
    var lastRenderedRange = null;
    var scrollTicking = false;

    function getVisibleRange(index, total, buffer){
      return {
        start: Math.max(0, index - buffer),
        end: Math.min(total - 1, index + buffer)
      };
    }

    function buildItem(profile){
      var li = document.createElement('li');
      li.className = 'profile-item';
      li.dataset.id = profile.id;

      var a = document.createElement('a');
      a.className = 'profile-link';
      a.href = profile.url;
      a.target = '_self';
      a.rel = 'noopener noreferrer';
      a.setAttribute('aria-label', 'Open profile: ' + profile.name);

      var avatar = document.createElement('span');
      avatar.className = 'avatar';
      avatar.setAttribute('aria-hidden', 'true');

      if(profile.image === 'emblem' || !profile.image){
        mountEmblem(avatar);
      } else {
        var img = document.createElement('img');
        img.src = profile.image;
        img.alt = '';
        img.loading = 'lazy';
        img.decoding = 'async';
        img.style.cssText = 'width:100%;height:100%;object-fit:cover;border-radius:50%;';
        img.onerror = function(){
          img.remove();
          mountEmblem(avatar);
        };
        avatar.appendChild(img);
      }

      var name = document.createElement('span');
      name.className = 'profile-name';
      name.textContent = profile.name;

      var chevron = document.createElement('span');
      chevron.className = 'chevron';
      chevron.setAttribute('aria-hidden', 'true');
      chevron.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

      a.appendChild(avatar);
      a.appendChild(name);
      a.appendChild(chevron);
      li.appendChild(a);

      attachInteraction(a);
      return li;
    }

    function attachInteraction(a){
      if(!isTouch){
        a.addEventListener('mousemove', function(e){
          var rect = a.getBoundingClientRect();
          a.style.setProperty('--mx', ((e.clientX-rect.left)/rect.width*100) + '%');
          a.style.setProperty('--my', ((e.clientY-rect.top)/rect.height*100) + '%');
        });
      } else {
        a.addEventListener('touchstart', function(){ a.classList.add('touch-active'); }, { passive: true });
        a.addEventListener('touchend', function(){ a.classList.remove('touch-active'); }, { passive: true });
        a.addEventListener('touchcancel', function(){ a.classList.remove('touch-active'); }, { passive: true });
      }
    }

    function renderVisible(force){
      var range = getVisibleRange(currentIndex, profiles.length, BUFFER);
      if(!force && lastRenderedRange && range.start === lastRenderedRange.start && range.end === lastRenderedRange.end){
        return;
      }
      lastRenderedRange = range;

      listEl.innerHTML = '';
      var frag = document.createDocumentFragment();
      for(var i = range.start; i <= range.end; i++){
        frag.appendChild(buildItem(profiles[i]));
      }
      listEl.appendChild(frag);
      animateIn();
    }

    function animateIn(){
      var items = listEl.querySelectorAll('.profile-item');
      items.forEach(function(item, i){
        var delay = reducedMotion ? 0 : 120 + i * 90;
        setTimeout(function(){
          item.style.transition = 'opacity .7s ' + (reducedMotion ? 'linear' : 'cubic-bezier(.16,.84,.28,1)') + ', transform .8s ' + (reducedMotion ? 'linear' : 'cubic-bezier(.22,1.2,.36,1)');
          item.style.opacity = '1';
          item.style.transform = 'translateY(0) scale(1)';
        }, delay);
      });
    }

    function onScroll(){
      if(scrollTicking) return;
      scrollTicking = true;
      requestAnimationFrame(function(){
        var scrollTop = window.scrollY || document.documentElement.scrollTop || 0;
        var estimatedIndex = Math.round(scrollTop / ITEM_HEIGHT_ESTIMATE);
        currentIndex = Math.max(0, Math.min(profiles.length - 1, estimatedIndex));
        renderVisible();
        scrollTicking = false;
      });
    }

    function setDataSource(newProfiles){
      profiles = newProfiles;
      currentIndex = 0;
      lastRenderedRange = null;
      renderVisible(true);
    }

    function init(){
      window.addEventListener('scroll', onScroll, { passive: true });
      renderVisible(true);
    }

    return { init: init, setDataSource: setDataSource };
  })();

  /* ============================================================
     9. PAGE VISIBILITY
  ============================================================ */
  document.addEventListener('visibilitychange', function(){
    if(document.hidden){
      Scene3D.stop();
    } else {
      Scene3D.start();
    }
  });

  /* ============================================================
     10. BOOT
  ============================================================ */
  function boot(){
    var sceneReady = Scene3D.init();

    IntroController.play(function(){
      if(sceneReady) Scene3D.start();
      ProfileEngine.init();
      document.getElementById('app').classList.add('visible');
    });
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }

})();

</script>
